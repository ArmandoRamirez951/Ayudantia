<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sección de Animaciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .nav-left, .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .btn {
            background: transparent;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: #dc2626;
            color: white;
            border: none;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .main-container {
            width: 90%;
            max-width: 1200px;
            padding: 40px 0;
        }

        #grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .anim-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .anim-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -8px rgba(0,0,0,0.5);
            border-color: var(--primary);
        }

        .card-img-container {
            width: 100%;
            height: 160px;
            background: #000;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .anim-card:hover .card-img-container img {
            opacity: 1;
        }

        .card-body {
            padding: 20px;
        }

        .card-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        #detail-view {
            display: none;
            width: 100%;
        }

        .repo-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .repo-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .slide-preview {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .file-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .code-box {
            background: #020617;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            color: #a5b4fc;
            border: 1px solid var(--border-color);
            line-height: 1.5;
        }

        /* --- NUEVO ESTILO CORPORATIVO --- */
        .repo-header-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            border-left: 4px solid var(--primary);
        }

        .repo-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .meta-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .meta-value {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .file-info-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #btn-regresar, #action-buttons {
            display: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            padding-top: 40px; /* Espacio para la X */
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-content h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-main);
            text-align: center;
        }

        .btn-close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .btn-close-modal:hover {
            background: rgba(220, 38, 38, 0.9);
            color: white;
            transform: scale(1.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        .form-group input[type="file"] {
            padding: 8px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-content">
            <div class="nav-left">
                <a href="index.html" class="btn" id="btn-inicio">⬅ Volver al Inicio</a>
                <button class="btn" id="btn-regresar" onclick="cerrarDetalle()">⬅ Catálogo</button>
            </div>
            
            <h1 class="nav-title">Sección de Programación</h1>

            <div class="nav-right" id="nav-actions">
                <button class="btn btn-primary" onclick="abrirModal()">+ Agregar</button>
            </div>

            <div class="nav-right" id="action-buttons">
                <button class="btn" onclick="editarAnimacion()">Editar</button>
                <button class="btn btn-danger" onclick="eliminarAnimacion()">Eliminar</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- VISTA DE GALERÍA GENERADA DINÁMICAMENTE -->
        <div id="grid-view"></div>
        <!-- VISTA DE DETALLE GENERADA DINÁMICAMENTE -->
        <div id="detail-view"></div>
    </div>

    <!-- VENTANA MODAL (FORMULARIO CREAR/EDITAR) -->
    <div class="modal-overlay" id="modal-agregar">
        <div class="modal-content">
            <button class="btn-close-modal" onclick="cerrarModal()" title="Cerrar">X</button>
            <h2 id="modal-title">Agregar Nueva Animación</h2>
            <input type="hidden" id="input-id">
            
            <div class="form-group">
                <label>Nombre de la presentación</label>
                <input type="text" id="input-presentacion" placeholder="Ej. Unidad II_Sistemas...">
            </div>

            <div class="form-group">
                <label>Nombre de la diapositiva</label>
                <input type="text" id="input-diapositiva" placeholder="Ej. Tipos de investigación">
            </div>

            <div class="form-group">
                <label>Foto de la diapositiva</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="file" id="input-foto" accept="image/png, image/jpeg" onchange="mostrarVistaPrevia()">
                </div>
                <div id="preview-container" style="display: none; position: relative; margin-top: 10px;">
                    <img id="preview-img" style="width: 100%; border-radius: 8px; border: 1px solid var(--border-color); display: block;">
                    <button type="button" onclick="quitarFoto()" style="position: absolute; top: 10px; right: 10px; background: rgba(220, 38, 38, 0.9); color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: bold;">X Quitar</button>
                </div>
            </div>

            <div class="form-group">
                <label>Archivo de reconocimiento (.mind)</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="file" id="input-mind" accept=".mind" onchange="verificarArchivoMind()">
                    <button type="button" id="btn-quitar-mind" onclick="quitarMind()" style="display: none; background: rgba(220, 38, 38, 0.9); color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: bold;">X Quitar</button>
                </div>
            </div>

            <div class="form-group">
                <label>Código de animación (A-Frame)</label>
                <textarea id="input-codigo" placeholder="<a-entity>...</a-entity>"></textarea>
            </div>

            <div class="modal-buttons">
                <button class="btn" onclick="cerrarModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="guardarAnimacion()">Guardar Animación</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT CMS DINÁMICO -->
    <script>
        let dbData = [];
        let currentItem = null;

        // 1. Cargar datos al iniciar
        async function cargarDatos() {
            try {
                // Truco para evitar cache en Github Pages durante el desarrollo: ?t=Date.now()
                const res = await fetch('diapositivas.json?t=' + Date.now());
                const json = await res.json();
                dbData = json.diapositivas;
                renderGrid();
            } catch (err) {
                console.error("Error cargando la base de datos JSON", err);
            }
        }

        // 2. Renderizar Cuadrícula
        function renderGrid() {
            const grid = document.getElementById('grid-view');
            grid.innerHTML = '';
            
            dbData.forEach(item => {
                grid.innerHTML += `
                <div class="anim-card" onclick="abrirDetalle('${item.id}')">
                    <div class="card-img-container">
                        <img src="${item.foto}" alt="${item.nombreDiapositiva}">
                    </div>
                    <div class="card-body">
                        <div class="card-subtitle">${item.nombrePresentacion}</div>
                        <h3 class="card-title">${item.nombreDiapositiva}</h3>
                    </div>
                </div>`;
            });
        }

        // 3. Abrir Detalle
        function abrirDetalle(id) {
            currentItem = dbData.find(d => d.id == id);
            if(!currentItem) return;

            const detailView = document.getElementById('detail-view');
            
            // Reemplazar caracteres especiales HTML para que se vea como texto en el pre
            const htmlCodeSafe = currentItem.codigoAnimacion.replace(/</g, '&lt;').replace(/>/g, '&gt;');

            detailView.innerHTML = `
                <!-- Encabezado Corporativo -->
                <div class="repo-header-panel">
                    <div class="repo-meta-row">
                        <div class="meta-item">
                            <span class="meta-label">Presentación Asignada</span>
                            <span class="meta-value">${currentItem.nombrePresentacion}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Nombre de la Diapositiva</span>
                            <span class="meta-value">${currentItem.nombreDiapositiva}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">ID de Registro</span>
                            <span class="meta-value">#${currentItem.id}</span>
                        </div>
                    </div>
                </div>

                <div class="repo-layout">
                    
                    <!-- Panel Izquierdo: Archivos y Referencias -->
                    <div class="panel">
                        <h3 class="panel-title">Archivos de Referencia</h3>
                        
                        <div class="file-info-group">
                            <span class="meta-label">Imagen de Activación (.PNG / .JPG)</span>
                            <img src="${currentItem.foto}" alt="${currentItem.nombreDiapositiva}" class="slide-preview" style="margin-bottom: 0;">
                        </div>
                        
                        <div class="file-info-group">
                            <span class="meta-label">Patrón de Reconocimiento (.MIND)</span>
                            <div class="file-badge">${currentItem.mindFile}</div>
                        </div>
                    </div>

                    <!-- Panel Derecho: Código -->
                    <div class="panel">
                        <h3 class="panel-title">Código de Animación 3D (A-Frame)</h3>
                        <div class="code-box">
<pre>${htmlCodeSafe}</pre>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('grid-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            
            document.getElementById('btn-inicio').style.display = 'none';
            document.getElementById('nav-actions').style.display = 'none';
            
            document.getElementById('btn-regresar').style.display = 'flex';
            document.getElementById('action-buttons').style.display = 'flex';
        }

        // 4. Cerrar Detalle
        function cerrarDetalle() {
            currentItem = null;
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('grid-view').style.display = 'grid';
            
            document.getElementById('btn-regresar').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'none';
            
            document.getElementById('btn-inicio').style.display = 'flex';
            document.getElementById('nav-actions').style.display = 'flex';
        }

        // 5. Modal Funciones
        function abrirModal(editMode = false) {
            document.getElementById('modal-agregar').style.display = 'flex';
            
            if (editMode && currentItem) {
                document.getElementById('modal-title').innerText = "Editar Animación";
                document.getElementById('input-id').value = currentItem.id;
                document.getElementById('input-presentacion').value = currentItem.nombrePresentacion;
                document.getElementById('input-diapositiva').value = currentItem.nombreDiapositiva;
                document.getElementById('input-codigo').value = currentItem.codigoAnimacion;
                
                // Mostrar foto actual en vista previa
                const previewImg = document.getElementById('preview-img');
                const previewContainer = document.getElementById('preview-container');
                previewImg.src = currentItem.foto;
                previewContainer.style.display = 'block';
            } else {
                document.getElementById('modal-title').innerText = "Agregar Nueva Animación";
                document.getElementById('input-id').value = "";
                document.getElementById('input-presentacion').value = "";
                document.getElementById('input-diapositiva').value = "";
                document.getElementById('input-codigo').value = "";
                quitarFoto();
                quitarMind();
            }
        }

        function cerrarModal() {
            document.getElementById('modal-agregar').style.display = 'none';
        }

        function editarAnimacion() {
            abrirModal(true);
        }

        // Utilidades de la UI (Fotos y Mind)
        function mostrarVistaPrevia() {
            const input = document.getElementById('input-foto');
            const previewContainer = document.getElementById('preview-container');
            const previewImg = document.getElementById('preview-img');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewContainer.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function quitarFoto() {
            document.getElementById('input-foto').value = '';
            document.getElementById('preview-container').style.display = 'none';
        }

        function verificarArchivoMind() {
            const btn = document.getElementById('btn-quitar-mind');
            btn.style.display = document.getElementById('input-mind').files.length > 0 ? 'block' : 'none';
        }

        function quitarMind() {
            document.getElementById('input-mind').value = '';
            document.getElementById('btn-quitar-mind').style.display = 'none';
        }

        // 6. Enviar Formulario (Crear / Editar)
        async function guardarAnimacion() {
            const id = document.getElementById('input-id').value;
            const esEdicion = id !== "";
            const confirmMsg = esEdicion ? "¿Guardar cambios en esta animación?" : "¿Guardar esta nueva animación?";
            
            if (!confirm(confirmMsg)) return;

            const nombrePres = document.getElementById('input-presentacion').value;
            const nombreDiap = document.getElementById('input-diapositiva').value;
            const foto = document.getElementById('input-foto').files[0];
            const mindFile = document.getElementById('input-mind').files[0];
            const codigo = document.getElementById('input-codigo').value;

            if(!nombrePres || !nombreDiap || !codigo) {
                alert("Error: Todos los campos de texto son obligatorios.");
                return;
            }

            if(!esEdicion && (!foto || !mindFile)) {
                alert("Error: Para una NUEVA animación es obligatorio subir la foto y el archivo .mind.");
                return;
            }

            const formData = new FormData();
            if (esEdicion) formData.append('id', id);
            formData.append('nombrePresentacion', nombrePres);
            formData.append('nombreDiapositiva', nombreDiap);
            if(foto) formData.append('foto', foto);
            if(mindFile) formData.append('mindFile', mindFile);
            formData.append('codigoAnimacion', codigo);

            try {
                const response = await fetch('/api/upload-animacion', {
                    method: 'POST',
                    body: formData
                });

                if(response.ok) {
                    alert("¡Guardado correctamente!");
                    window.location.reload();
                } else {
                    alert("Error en el servidor local.");
                }
            } catch (error) {
                alert("Error de conexión. ¿Está corriendo node server.js?");
            }
        }

        // 7. Eliminar Animación
        async function eliminarAnimacion() {
            if(!currentItem) return;
            if(!confirm("⚠️ ¿Peligro: Estás seguro de eliminar esta animación del sistema?")) return;

            try {
                const response = await fetch('/api/delete-animacion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: currentItem.id })
                });

                if(response.ok) {
                    alert("¡Eliminado correctamente!");
                    window.location.reload();
                } else {
                    alert("Error en el servidor local.");
                }
            } catch (error) {
                alert("Error de conexión.");
            }
        }

        // Iniciar
        window.onload = cargarDatos;
    </script>
</body>
</html>
