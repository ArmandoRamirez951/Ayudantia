<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR - Método Científico</title>
    
    <!-- Incluimos los estilos CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Incluimos A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- NUEVO: Librería necesaria para reproducir las animaciones profesionales de los archivos .glb -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <!-- Incluimos la lógica de JavaScript -->
    <script src="app.js" defer></script>
</head>
<body>

    <!-- Interfaz de usuario (overlay) -->
    <div id="ui-container">
        <h2>📷 Activa tu cámara</h2>
        <p>Apunta a la diapositiva para ver la animación</p>
    </div>

    <div id="finished-msg">Animación finalizada</div>

    <!-- Escena de A-Frame configurada con MindAR -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no; uiLoading: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <!-- Cargamos nuestro modelo 3D en la memoria de la escena -->
        <a-assets>
            <a-asset-item id="modeloProfesional" src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Fox/glTF-Binary/Fox.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- Contenedor que aparecerá SOBRE la imagen cuando sea detectada -->
        <a-entity mindar-image-target="targetIndex: 0" id="ar-content">
            
            <!-- Texto flotante -->
            <a-text value="¡Bienvenidos!" color="#000000" align="center" position="0 0.8 0" scale="1.5 1.5 1.5"
                    geometry="primitive: plane; width: 1.5; height: 0.5" material="color: #ffffff; opacity: 0.9"
                    animation="property: position; to: 0 0.85 0; dir: alternate; dur: 1000; loop: true">
            </a-text>

            <!-- 
                AQUÍ IMPLEMENTAMOS EL MODELO PROFESIONAL 
                - gltf-model="#modeloProfesional": Llama al archivo .glb
                - animation-mixer="clip: *": Le dice que reproduzca automáticamente la animación que el diseñador le grabó al modelo (ej. caminar o correr)
            -->
            <a-entity 
                gltf-model="#modeloProfesional" 
                position="0 -0.2 0" 
                scale="0.01 0.01 0.01" 
                rotation="0 0 0"
                animation-mixer="clip: *">
            </a-entity>

        </a-entity>
    </a-scene>

</body>
</html>
