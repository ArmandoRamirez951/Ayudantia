<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ayudantía</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --secondary: #334155;
            --secondary-hover: #475569;
            --bg-color: #0f172a;
            --text-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 40px 0;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, var(--bg-color));
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-y: auto;
            /* Habilita el scroll de arriba a abajo */
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 50px;
        }

        .menu-container {
            display: flex;
            flex-direction: row;
            /* Botones horizontales */
            justify-content: center;
            gap: 30px;
            width: 90%;
            max-width: 600px;
            flex-wrap: wrap;
            /* Si la pantalla es pequeña, bajan solos */
        }

        .btn {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            /* Icono arriba, texto abajo */
            align-items: center;
            justify-content: center;
            width: 200px;
            /* Cuadros grandes */
            height: 200px;
            /* Cuadros grandes */
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.4);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.7);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: var(--secondary-hover);
            transform: translateY(-3px);
        }

        .btn-icon {
            font-size: 3rem;
            /* Icono mucho más grande */
            margin-right: 0;
            margin-bottom: 15px;
            /* Separación entre el icono y el texto */
        }

        .qr-section {
            margin-top: 40px;
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-section p {
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        #qrcode {
            background: white;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Bienvenido al Sistema</h1>
    <p>Selecciona una opción para continuar</p>

    <div class="menu-container">
        <!-- Botón que nos manda a la cámara (Realidad Aumentada) -->
        <a href="camara.html" class="btn btn-primary">
            <span class="btn-icon">🚀</span> Animaciones
        </a>

        <!-- Botón de administrador (Nos manda al mini-repositorio) -->
        <a href="programacion.html" class="btn btn-secondary">
            <span class="btn-icon">⚙️</span> Sección de programación
        </a>

        <!-- Sección del Código QR Dinámico -->
        <div class="qr-section">
            <p>Escanea para ir a la cámara desde tu teléfono 👇</p>
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        // Esta pequeña fórmula toma el link en el que estás actualmente (ya sea el local o el de GitHub) 
        // y le pega automáticamente 'camara.html' al final de manera inteligente.
        const currentUrl = window.location.href;
        const cameraUrl = new URL('camara.html', currentUrl).href;

        // Generamos el Código QR
        new QRCode(document.getElementById("qrcode"), {
            text: cameraUrl,
            width: 250, /* QR Más grande */
            height: 250, /* QR Más grande */
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>

</html>
