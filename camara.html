<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Visor AR • Sistema de Ayudantía 2026</title>

    <!-- Incluimos los estilos CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Incluimos A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- NUEVO: Librería necesaria para reproducir las animaciones profesionales de los archivos .glb -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <!-- Incluimos la lógica de JavaScript -->
    <script src="app.js" defer></script>
</head>

<body>

    <!-- Barra Superior HUD Administrativo UABC FCA -->
    <header class="ar-hud-topbar">
        <div class="ar-hud-left">
            <a href="index.html" class="ar-back-btn">← Portal</a>
            <img src="interfaz/uabc_fca.jpg" alt="UABC FCA" style="height: 36px; width: auto; border-radius: 4px;">
            <div class="ar-brand-meta">
                <span class="ar-brand-title">Visor Óptico de Realidad Aumentada</span>
                <span class="ar-brand-sub">FCA UABC • Escáner Científico MindAR</span>
            </div>
        </div>
        <div class="ar-hud-status" id="ar-status-pill">
            <span class="ar-status-dot"></span>
            <span id="ar-status-label">BUSCANDO DIAPOSITIVA</span>
        </div>
    </header>

    <!-- Interfaz de usuario (overlay) - Estructura intacta para app.js -->
    <div id="ui-container">
        <div class="scanner-text">
            <h2>📷 Escanea la Diapositiva</h2>
            <p>Alinea la imagen dentro del recuadro</p>
        </div>
        <div class="scanner-frame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>
    </div>

    <div id="finished-msg">Animación finalizada</div>

    <!-- Barra Inferior de Telemetría HUD -->
    <div class="ar-hud-bottom">
        <span>ÓPTICA: ACTIVA</span>
        <span>•</span>
        <span>RENDER: A-FRAME 3D</span>
        <span>•</span>
        <span id="ar-target-telemetry">TARGET: #00 (EN ESPERA)</span>
    </div>

    <!-- Escena de A-Frame configurada con MindAR (100% Intacta) -->
    <a-scene mindar-image="imageTargetSrc: ./Modelos_AR/diapositiva1.mind; autoStart: true; uiScanning: no; uiLoading: no;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Cargamos nuestro modelo 3D en la memoria de la escena -->
        <a-assets>
            <a-asset-item id="modeloProfesional"
                src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Fox/glTF-Binary/Fox.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Contenedor que aparecerá SOBRE la imagen cuando sea detectada -->
        <a-entity mindar-image-target="targetIndex: 0" id="ar-content">
            <!-- El código de la animación se inyectará aquí automáticamente desde app.js -->
        </a-entity>
    </a-scene>

    <!-- Script de telemetría visual del HUD (No modifica ni interfiere con app.js) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const scene = document.querySelector('a-scene');
            const statusPill = document.getElementById('ar-status-pill');
            const statusLabel = document.getElementById('ar-status-label');
            const telemetry = document.getElementById('ar-target-telemetry');

            if (scene) {
                scene.addEventListener("targetFound", () => {
                    if (statusPill) statusPill.classList.add('detected');
                    if (statusLabel) statusLabel.textContent = "DIAPOSITIVA DETECTADA • 3D ACTIVO";
                    if (telemetry) telemetry.textContent = "TARGET: #00 (SINCRONIZADO)";
                });

                scene.addEventListener("targetLost", () => {
                    if (statusPill) statusPill.classList.remove('detected');
                    if (statusLabel) statusLabel.textContent = "BUSCANDO DIAPOSITIVA";
                    if (telemetry) telemetry.textContent = "TARGET: #00 (EN ESPERA)";
                });
            }
        });
    </script>
</body>

</html>
