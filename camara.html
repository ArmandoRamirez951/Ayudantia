<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR - Sistema de Realidad Virtual</title>

    <!-- Incluimos los estilos CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Incluimos A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- NUEVO: Librería necesaria para reproducir las animaciones profesionales de los archivos .glb -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <!-- Incluimos la lógica de JavaScript -->
    <script src="app.js" defer></script>
</head>

<body>

    <!-- Interfaz de usuario (overlay) -->
    <div id="ui-container">
        <div class="scanner-text" id="scanner-status-box">
            <h2>📷 Escanea la Diapositiva</h2>
            <p>Alinea y enfoca la diapositiva dentro del recuadro</p>
        </div>
        <div class="scanner-frame" id="scanner-guide-frame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="scanner-focus-hint" id="scanner-focus-badge">Encuadra la diapositiva aquí</div>
        </div>
    </div>

    <!-- Control táctil de Zoom para dispositivos móviles (soporta pellizco en pantalla y barra deslizante) -->
    <div id="camera-zoom-controls" aria-label="Controles de zoom de cámara">
        <button type="button" class="zoom-btn" id="btn-zoom-out" title="Alejar zoom">➖</button>
        <input type="range" id="camera-zoom-slider" min="1" max="4" step="0.1" value="1">
        <button type="button" class="zoom-btn" id="btn-zoom-in" title="Acercar zoom">➕</button>
        <button type="button" class="zoom-badge" id="camera-zoom-badge" title="Restablecer zoom a 1.0x">1.0x</button>
    </div>

    <div id="finished-msg">Animación finalizada</div>

    <!-- Escena de A-Frame configurada con MindAR (autoStart: false para cargar todas las diapositivas de diapositivas.json dinámicamente desde app.js) -->
    <a-scene mindar-image="imageTargetSrc: ./Modelos_AR/diapositiva1.mind; autoStart: false; uiScanning: no; uiLoading: no;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Cargamos nuestro modelo 3D en la memoria de la escena -->
        <a-assets>
            <a-asset-item id="modeloProfesional"
                src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Fox/glTF-Binary/Fox.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Contenedor que aparecerá SOBRE la imagen cuando sea detectada -->
        <a-entity mindar-image-target="targetIndex: 0" id="ar-content">
            <!-- El código de la animación se inyectará aquí automáticamente desde app.js -->
        </a-entity>
    </a-scene>

</body>

</html>
